[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "predictive_maintenance"
version = "0.0.1"
description = "Reproducible NASA C-MAPSS remaining useful life training, serving and monitoring."
authors = [
  { name = "Abdellatif Mahamat Dougouye" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "lightgbm>=4.5,<5",
    "loguru>=0.7,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1,<2",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "joblib>=1.4,<2",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
    "typer>=0.12,<1",
    "xgboost>=2.1,<4",
]
requires-python = ">=3.10,<3.14"

[project.optional-dependencies]
deep-learning = ["torch>=2.5,<3"]
monitoring = ["streamlit>=1.40,<2", "plotly>=5.24,<7", "requests>=2.32,<3"]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]
docs = ["mkdocs>=1.6,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
pm-train = "predictive_maintenance.pipeline:app"
pm-data = "predictive_maintenance.dataset:app"
pm-predict = "predictive_maintenance.models.predict:app"
pm-evaluate = "predictive_maintenance.models.evaluate:app"
pm-reference = "predictive_maintenance.monitoring.build_reference:app"
pm-stream = "predictive_maintenance.monitoring.simulate_stream:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 99
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["predictive_maintenance"]
force-sort-within-sections = true

